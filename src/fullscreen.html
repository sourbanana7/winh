<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Winh Fullscreen Lyrics</title>
  <style>
    :root {
      --color-1: #4b7bec;
      --color-2: #74b9ff;
      --color-3: #e07a5f;
      --text: #f9fafb;
      --subtext: rgba(255, 255, 255, 0.66);
      --muted: rgba(255, 255, 255, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0b0f;
      color: var(--text);
      font-family: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Blurred Album Art Backdrop */
    .backdrop-root {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(155deg, #0c0d12 0%, #090a0d 100%);
    }

    .backdrop-img {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      object-fit: cover;
      filter: blur(78px) saturate(140%) brightness(0.42);
      opacity: 0;
      transform: scale(1.16) translate3d(0, 0, 0);
      transition: opacity 0.9s ease;
      animation: ambientDrift 30s ease-in-out infinite alternate;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .backdrop-img.visible {
      opacity: 1;
    }

    @keyframes ambientDrift {
      0% { transform: scale(1.14) translate3d(-1.2%, -0.8%, 0); }
      50% { transform: scale(1.20) translate3d(1.5%, 1.0%, 0); }
      100% { transform: scale(1.16) translate3d(-0.8%, 1.5%, 0); }
    }

    .backdrop-scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(120% 100% at 50% 50%, rgba(8, 9, 13, 0.28) 0%, rgba(6, 7, 10, 0.72) 100%),
        linear-gradient(180deg, rgba(6, 7, 10, 0.34) 0%, rgba(6, 7, 10, 0.14) 50%, rgba(6, 7, 10, 0.48) 100%);
      pointer-events: none;
    }

    .backdrop-audio-aura {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.15;
      background: radial-gradient(60% 60% at 28% 48%, rgba(255, 255, 255, 0.08), transparent 70%);
      transition: opacity 0.12s linear;
    }

    /* Auto-hiding Top Bar */
    .top-bar {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .top-bar.idle-hidden {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .exit-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 19, 24, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: rgba(255, 255, 255, 0.85);
      font-family: inherit;
      font-size: 12px;
      font-weight: 550;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .exit-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.24);
    }

    .exit-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .esc-hint {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      margin-left: 2px;
    }

    /* Main Split Stage */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: clamp(32px, 5vh, 64px) clamp(36px, 5vw, 84px);
      display: grid;
      grid-template-columns: minmax(290px, 400px) minmax(0, 1fr);
      gap: clamp(36px, 6vw, 96px);
      align-items: center;
    }

    /* Left Column */
    .player-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .art-stage {
      position: relative;
      width: clamp(240px, 26vw, 356px);
      aspect-ratio: 1 / 1;
    }

    .art-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.58),
        0 8px 20px rgba(0, 0, 0, 0.34);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .art-card.paused {
      transform: scale(0.96);
    }

    .art-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .art-fallback {
      width: 56px;
      height: 56px;
      color: rgba(255, 255, 255, 0.32);
    }

    .track-meta {
      width: 100%;
      max-width: 356px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .source-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.52);
      margin-bottom: 2px;
    }

    .status-dot {
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
    }

    .status-dot.playing {
      background: #34d399;
    }

    .status-dot.paused {
      background: #fbbf24;
    }

    .fs-title {
      font-size: clamp(22px, 2.2vw, 29px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.18;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fs-artist {
      font-size: clamp(14.5px, 1.25vw, 17px);
      font-weight: 500;
      color: var(--subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scrubbable Progress Bar */
    .progress-wrap {
      width: 100%;
      max-width: 356px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scrub-track {
      position: relative;
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .scrub-rail {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
      transition: height 0.15s ease;
    }

    .scrub-track:hover .scrub-rail,
    .scrub-track.scrubbing .scrub-rail {
      height: 6px;
    }

    .scrub-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
    }

    .scrub-knob {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.14s ease;
      pointer-events: none;
    }

    .scrub-track:hover .scrub-knob,
    .scrub-track.scrubbing .scrub-knob {
      transform: translate(-50%, -50%) scale(1);
    }

    .time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* Transport Controls */
    .transport-row {
      width: 100%;
      max-width: 356px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 2px;
    }

    .t-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.76);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease, color 0.15s ease;
    }

    .t-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .t-btn:active {
      transform: scale(0.93);
    }

    .t-btn.primary {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.92);
      color: #0b0c10;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.36);
    }

    .t-btn.primary:hover {
      background: #ffffff;
      transform: scale(1.04);
    }

    .t-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .t-btn.primary svg {
      width: 24px;
      height: 24px;
    }

    /* Right Column: Clean Spatial Scrolling Lyrics */
    .lyrics-col {
      position: relative;
      height: 82vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .lyrics-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      perspective: 1200px;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
      display: none;
    }

    .lyrics-col[data-mode="synced"] .lyrics-stage {
      display: block;
    }

    .lyrics-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 0 8px 0 4px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .fs-lyric-line {
      appearance: none;
      border: none;
      background: transparent;
      text-align: left;
      width: 100%;
      font-family: inherit;
      font-size: clamp(24px, 2.7vw, 36px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.022em;
      color: rgba(255, 255, 255, 0.88);
      transform-origin: left center;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition:
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.38s ease,
        color 0.3s ease,
        background 0.18s ease;
      will-change: transform, opacity;
    }

    .fs-lyric-line:hover {
      background: rgba(255, 255, 255, 0.06);
      opacity: 0.94 !important;
    }

    /* Clean Spatial Depth Hierarchy */
    .fs-lyric-line.dist-0 {
      opacity: 1;
      color: #ffffff;
      transform: translate3d(0, 0, 18px) scale(1.02);
    }

    .fs-lyric-line.dist-1 {
      opacity: 0.48;
      transform: translate3d(0, 0, -14px) scale(0.95);
    }

    .fs-lyric-line.dist-2 {
      opacity: 0.25;
      transform: translate3d(0, 0, -40px) scale(0.90);
    }

    .fs-lyric-line.dist-3 {
      opacity: 0.13;
      transform: translate3d(0, 0, -68px) scale(0.86);
    }

    .fs-lyric-line.dist-far {
      opacity: 0.06;
      transform: translate3d(0, 0, -96px) scale(0.83);
    }

    .fs-lyric-line.is-past.dist-1 { opacity: 0.34; }
    .fs-lyric-line.is-past.dist-2 { opacity: 0.17; }
    .fs-lyric-line.is-past.dist-3 { opacity: 0.09; }

    .lyrics-stage.browsing .fs-lyric-line {
      opacity: 0.72;
    }

    .lyrics-stage.browsing .fs-lyric-line.dist-0 {
      opacity: 1;
    }

    /* Plain Unsynced Scrollable View */
    .plain-stage {
      display: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 48px 16px 64px 4px;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
      font-size: clamp(20px, 2vw, 25px);
      font-weight: 600;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.84);
      white-space: pre-line;
    }

    .plain-stage::-webkit-scrollbar {
      width: 4px;
    }

    .plain-stage::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .lyrics-col[data-mode="plain"] .plain-stage {
      display: block;
    }

    /* Status / Empty / Instrumental View */
    .status-stage {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: flex-start;
      padding-left: 8px;
      font-size: clamp(20px, 2.1vw, 26px);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
    }

    .lyrics-col[data-mode="status"] .status-stage {
      display: flex;
    }

    @media (max-width: 820px) {
      .stage {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 24px;
      }
      .player-col {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      .art-stage {
        width: 96px;
      }
      .lyrics-col {
        height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop-root">
    <img class="backdrop-img" id="backdrop-a" alt="" />
    <img class="backdrop-img" id="backdrop-b" alt="" />
  </div>
  <div class="backdrop-scrim"></div>
  <div class="backdrop-audio-aura" id="backdrop-aura"></div>

  <div class="top-bar" id="top-bar">
    <button class="exit-btn" id="btn-exit" title="Exit Fullscreen (Esc or Shift+F11)">
      <svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      <span>Exit</span>
      <span class="esc-hint">Esc</span>
    </button>
  </div>

  <main class="stage">
    <!-- Left Column -->
    <section class="player-col">
      <div class="art-stage">
        <div class="art-card" id="art-card">
          <svg class="art-fallback" id="art-fallback" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
          </svg>
          <img id="art-img" alt="" />
        </div>
      </div>

      <div class="track-meta">
        <div class="source-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="app-name">System Media</span>
        </div>
        <div class="fs-title" id="track-title">No media playing</div>
        <div class="fs-artist" id="track-artist">Start playback to view lyrics</div>
      </div>

      <div class="progress-wrap">
        <div class="scrub-track" id="scrub-track">
          <div class="scrub-rail">
            <div class="scrub-fill" id="scrub-fill"></div>
          </div>
          <div class="scrub-knob" id="scrub-knob"></div>
        </div>
        <div class="time-row">
          <span id="time-elapsed">0:00</span>
          <span id="time-duration">0:00</span>
        </div>
      </div>

      <div class="transport-row">
        <button class="t-btn" id="btn-prev" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="t-btn primary" id="btn-play-pause" title="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        </button>
        <button class="t-btn" id="btn-next" title="Next">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
    </section>

    <!-- Right Column: Clean Spatial Synced Lyrics -->
    <section class="lyrics-col" id="lyrics-col" data-mode="status">
      <div class="lyrics-stage" id="lyrics-stage">
        <div class="lyrics-track" id="lyrics-track"></div>
      </div>
      <div class="plain-stage" id="plain-stage"></div>
      <div class="status-stage" id="status-stage">
        <span id="status-text">Lyrics appear here when playing</span>
      </div>
    </section>
  </main>

  <script>
    const { ipcRenderer } = require('electron');

    const topBar = document.getElementById('top-bar');
    const btnExit = document.getElementById('btn-exit');
    const backdropA = document.getElementById('backdrop-a');
    const backdropB = document.getElementById('backdrop-b');
    const backdropAura = document.getElementById('backdrop-aura');

    const artCard = document.getElementById('art-card');
    const artImg = document.getElementById('art-img');
    const artFallback = document.getElementById('art-fallback');
    const statusDot = document.getElementById('status-dot');
    const appNameEl = document.getElementById('app-name');
    const trackTitleEl = document.getElementById('track-title');
    const trackArtistEl = document.getElementById('track-artist');

    const scrubTrack = document.getElementById('scrub-track');
    const scrubFill = document.getElementById('scrub-fill');
    const scrubKnob = document.getElementById('scrub-knob');
    const timeElapsedEl = document.getElementById('time-elapsed');
    const timeDurationEl = document.getElementById('time-duration');

    const btnPrev = document.getElementById('btn-prev');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnNext = document.getElementById('btn-next');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    const lyricsCol = document.getElementById('lyrics-col');
    const lyricsStage = document.getElementById('lyrics-stage');
    const lyricsTrack = document.getElementById('lyrics-track');
    const plainStage = document.getElementById('plain-stage');
    const statusStage = document.getElementById('status-stage');

    let mediaState = {
      active: false,
      status: 'Stopped',
      position: 0,
      duration: 0,
      lastUpdatedMs: Date.now(),
      thumbnailKey: '',
      trackSig: ''
    };

    function getMediaTrackSig(data) {
      if (!data) return '';
      const app = data.appName || data.appId || '';
      const title = data.cleanTitle || data.title || '';
      const artist = data.cleanArtist || data.artist || '';
      return `${app}|${title}|${artist}`;
    }

    let lyricsState = {
      isSynced: false,
      syncedLyrics: [],
      lineEls: [],
      activeIdx: -99
    };

    let activeBackdropSlot = 'a';
    let isScrubbing = false;
    let scrubPreviewRatio = 0;
    let manualBrowseTimer = null;
    let manualBrowseOffset = 0;
    let isManualBrowsing = false;

    // --- Seek Grace & Transient State Mitigation ---
    let seekGraceUntilMs = 0;
    let seekTargetSec = 0;
    let seekGraceWasPlaying = false;
    let seekGraceTrackSig = '';

    function clearSeekGrace() {
      seekGraceUntilMs = 0;
      seekGraceTrackSig = '';
    }

    function commitSeek(targetSec) {
      if (!Number.isFinite(targetSec) || targetSec < 0) return;
      if (mediaState.duration > 0) {
        targetSec = Math.max(0, Math.min(mediaState.duration, targetSec));
      }
      const wasPlaying = mediaState.status === 'Playing';
      seekTargetSec = targetSec;
      seekGraceWasPlaying = wasPlaying;
      seekGraceTrackSig = mediaState.trackSig;
      seekGraceUntilMs = Date.now() + 900;

      mediaState.position = targetSec;
      mediaState.lastUpdatedMs = Date.now();
      ipcRenderer.send('seek-media', targetSec);
      syncPlayheadAndLyrics(Date.now());
    }

    let targetHz = 60;
    let audioAuraSmooth = 0;
    let audioAuraTarget = 0;
    let currentSettings = {
      rotationSpeed: 1.0,
      reactivity: 1.0
    };
    let lastProgressRatio = -1;
    let lastScrubKnobLeft = '';
    let lastAuraOpacity = '';
    let lastElapsedText = '';
    let rafId = null;

    // --- Auto-hide Exit Bar on mouse idle ---
    let idleHideTimer = null;
    function revealTopBar() {
      topBar.classList.remove('idle-hidden');
      if (idleHideTimer) clearTimeout(idleHideTimer);
      idleHideTimer = setTimeout(() => {
        if (!topBar.matches(':hover')) {
          topBar.classList.add('idle-hidden');
        }
      }, 2600);
    }

    window.addEventListener('mousemove', revealTopBar);
    revealTopBar();

    function exitFullscreen() {
      clearSeekGrace();
      ipcRenderer.send('toggle-fullscreen-lyrics', false);
    }

    btnExit.addEventListener('click', () => {
      btnExit.blur();
      exitFullscreen();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        exitFullscreen();
      } else if ((e.key === 'F11' || e.code === 'F11') && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) {
        if (e.repeat) return;
        e.preventDefault();
        ipcRenderer.send('fullscreen-hotkey');
      } else if (e.code === 'Space' && !e.target.closest('button')) {
        e.preventDefault();
        clearSeekGrace();
        ipcRenderer.send('media-control', 'play-pause');
      }
    });

    // --- Transport Controls ---
    btnPrev.addEventListener('click', () => {
      btnPrev.blur();
      clearSeekGrace();
      ipcRenderer.send('media-control', 'previous');
    });
    btnPlayPause.addEventListener('click', () => {
      btnPlayPause.blur();
      clearSeekGrace();
      ipcRenderer.send('media-control', 'play-pause');
    });
    btnNext.addEventListener('click', () => {
      btnNext.blur();
      clearSeekGrace();
      ipcRenderer.send('media-control', 'next');
    });

    // --- Scrubbable Progress Bar ---
    function getScrubRatio(clientX) {
      const rect = scrubTrack.getBoundingClientRect();
      if (rect.width <= 0) return 0;
      return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    }

    function applyProgressVisual(ratio) {
      const clamped = Math.max(0, Math.min(1, ratio));
      if (Math.abs(clamped - lastProgressRatio) >= 0.0005) {
        lastProgressRatio = clamped;
        scrubFill.style.transform = `scaleX(${clamped.toFixed(4)})`;
        const knobPct = `${(clamped * 100).toFixed(2)}%`;
        if (knobPct !== lastScrubKnobLeft) {
          lastScrubKnobLeft = knobPct;
          scrubKnob.style.left = knobPct;
        }
      }
    }

    scrubTrack.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || mediaState.duration <= 0) return;
      e.preventDefault();
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
      isScrubbing = true;
      scrubTrack.classList.add('scrubbing');
      if (scrubTrack.setPointerCapture) {
        try {
          scrubTrack.setPointerCapture(e.pointerId);
        } catch (_) {}
      }
      scrubPreviewRatio = getScrubRatio(e.clientX);
      applyProgressVisual(scrubPreviewRatio);
      timeElapsedEl.textContent = formatTime(scrubPreviewRatio * mediaState.duration);
    });

    scrubTrack.addEventListener('pointermove', (e) => {
      if (!isScrubbing) return;
      scrubPreviewRatio = getScrubRatio(e.clientX);
      applyProgressVisual(scrubPreviewRatio);
      timeElapsedEl.textContent = formatTime(scrubPreviewRatio * mediaState.duration);
    });

    function finishScrub(e) {
      if (!isScrubbing) return;
      isScrubbing = false;
      scrubTrack.classList.remove('scrubbing');
      if (scrubTrack.releasePointerCapture && e && e.pointerId !== undefined) {
        try {
          scrubTrack.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
      if (mediaState.duration > 0) {
        const targetSec = scrubPreviewRatio * mediaState.duration;
        commitSeek(targetSec);
      }
    }

    scrubTrack.addEventListener('pointerup', finishScrub);
    scrubTrack.addEventListener('pointercancel', finishScrub);
    scrubTrack.addEventListener('lostpointercapture', finishScrub);
    window.addEventListener('blur', () => {
      if (isScrubbing) finishScrub({});
    });

    // --- Backdrop Crossfade & Artwork Loading Helpers ---
    let artLoadSeq = 0;
    let backdropLoadSeq = 0;

    function resolveArtworkSrc(data) {
      if (!data) return '';
      if (typeof data.thumbnailDataUrl === 'string' && data.thumbnailDataUrl.startsWith('data:image/')) {
        return data.thumbnailDataUrl;
      }
      if (typeof data.thumbnail === 'string' && data.thumbnail.trim().length > 16) {
        const mime = data.thumbnailMime || 'image/jpeg';
        return `data:${mime};base64,${data.thumbnail.trim()}`;
      }
      return '';
    }

    function computeThumbKey(src) {
      if (!src) return '';
      const mid = Math.floor(src.length / 2);
      return `${src.length}:${src.slice(0, 48)}:${src.slice(mid, mid + 24)}:${src.slice(-24)}`;
    }

    function updateBackdropImage(src) {
      const seq = ++backdropLoadSeq;
      if (!src) {
        backdropA.onload = null;
        backdropB.onload = null;
        backdropA.classList.remove('visible');
        backdropB.classList.remove('visible');
        backdropA.removeAttribute('src');
        backdropB.removeAttribute('src');
        return;
      }
      const incoming = activeBackdropSlot === 'a' ? backdropB : backdropA;
      const outgoing = activeBackdropSlot === 'a' ? backdropA : backdropB;
      activeBackdropSlot = activeBackdropSlot === 'a' ? 'b' : 'a';

      const showIncoming = () => {
        if (seq !== backdropLoadSeq) return;
        incoming.classList.add('visible');
        outgoing.classList.remove('visible');
      };

      incoming.onload = showIncoming;
      incoming.onerror = () => {
        if (seq !== backdropLoadSeq) return;
        incoming.classList.remove('visible');
      };
      incoming.src = src;
      if (incoming.complete && incoming.naturalWidth > 0) {
        showIncoming();
      }
    }

    function applyArtwork(src) {
      const seq = ++artLoadSeq;
      if (!src) {
        artImg.onload = null;
        artImg.onerror = null;
        artImg.removeAttribute('src');
        artImg.style.display = 'none';
        artFallback.style.display = 'block';
        updateBackdropImage('');
        return;
      }

      const showArt = () => {
        if (seq !== artLoadSeq) return;
        artImg.style.display = 'block';
        artFallback.style.display = 'none';
      };

      artImg.onload = showArt;
      artImg.onerror = () => {
        if (seq !== artLoadSeq) return;
        artImg.style.display = 'none';
        artFallback.style.display = 'block';
        updateBackdropImage('');
      };
      artImg.src = src;
      if (artImg.complete && artImg.naturalWidth > 0) {
        showArt();
      }
      updateBackdropImage(src);
    }

    // --- Lyrics Rendering & Spatial Depth Positioning ---
    function setStatusView(text) {
      lyricsCol.setAttribute('data-mode', 'status');
      statusStage.textContent = '';
      const span = document.createElement('span');
      span.textContent = text;
      statusStage.appendChild(span);
    }

    function buildSyncedLines(lines) {
      lyricsTrack.textContent = '';
      lyricsState.lineEls = [];
      lyricsState.activeIdx = -99;
      manualBrowseOffset = 0;
      isManualBrowsing = false;
      lyricsStage.classList.remove('browsing');

      lines.forEach((line) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fs-lyric-line dist-far';
        btn.textContent = line.text;
        btn.addEventListener('click', () => {
          btn.blur();
          isManualBrowsing = false;
          manualBrowseOffset = 0;
          lyricsStage.classList.remove('browsing');
          commitSeek(line.time);
        });
        lyricsTrack.appendChild(btn);
        lyricsState.lineEls.push(btn);
      });

      requestAnimationFrame(() => updateSyncedLayout(lyricsState.activeIdx));
    }

    function updateSyncedLayout(activeIdx) {
      const els = lyricsState.lineEls;
      if (!els.length) return;

      const stageH = lyricsStage.clientHeight || window.innerHeight * 0.8;
      const focusIdx = activeIdx >= 0 ? activeIdx : 0;

      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        const diff = i - focusIdx;
        const abs = Math.abs(diff);

        el.classList.remove('dist-0', 'dist-1', 'dist-2', 'dist-3', 'dist-far', 'is-past');
        if (activeIdx < 0 && i === 0) {
          el.classList.add('dist-1');
        } else if (abs === 0) {
          el.classList.add('dist-0');
        } else if (abs === 1) {
          el.classList.add('dist-1');
        } else if (abs === 2) {
          el.classList.add('dist-2');
        } else if (abs === 3) {
          el.classList.add('dist-3');
        } else {
          el.classList.add('dist-far');
        }

        if (diff < 0 && activeIdx >= 0) {
          el.classList.add('is-past');
        }
      }

      const targetEl = els[focusIdx];
      if (!targetEl) return;

      const anchorY = stageH * 0.46;
      const centerOffset = targetEl.offsetTop + targetEl.offsetHeight * 0.5;
      let translateY = anchorY - centerOffset;

      if (isManualBrowsing) {
        const maxTrackScroll = Math.max(0, lyricsTrack.scrollHeight - stageH * 0.4);
        translateY = Math.min(anchorY, Math.max(-maxTrackScroll, translateY + manualBrowseOffset));
      }

      lyricsTrack.style.transform = `translate3d(0, ${Math.round(translateY)}px, 0)`;
    }

    lyricsStage.addEventListener('wheel', (e) => {
      if (!lyricsState.isSynced || !lyricsState.lineEls.length) return;
      e.preventDefault();
      isManualBrowsing = true;
      lyricsStage.classList.add('browsing');
      manualBrowseOffset -= e.deltaY * 0.75;

      const maxRange = lyricsTrack.scrollHeight || 800;
      manualBrowseOffset = Math.max(-maxRange, Math.min(maxRange, manualBrowseOffset));
      updateSyncedLayout(lyricsState.activeIdx);

      if (manualBrowseTimer) clearTimeout(manualBrowseTimer);
      manualBrowseTimer = setTimeout(() => {
        isManualBrowsing = false;
        manualBrowseOffset = 0;
        lyricsStage.classList.remove('browsing');
        updateSyncedLayout(lyricsState.activeIdx);
      }, 3400);
    }, { passive: false });

    function resolveSourceName(data) {
      if (data.appName && data.appName.trim()) return data.appName.trim();
      const id = (data.appId || '').toLowerCase();
      if (!id) return 'System Media';
      if (id.includes('spotify')) return 'Spotify';
      if (id.includes('chrome')) return 'Google Chrome';
      if (id.includes('msedge') || id.includes('edge')) return 'Microsoft Edge';
      if (id.includes('brave')) return 'Brave Browser';
      if (id.includes('firefox')) return 'Firefox';
      if (id.includes('applemusic') || id.includes('itunes')) return 'Apple Music';
      if (id.includes('vlc')) return 'VLC Player';
      return data.appId.replace(/\.exe$/i, '');
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) return '0:00';
      const total = Math.floor(sec);
      const mins = Math.floor(total / 60);
      const secs = total % 60;
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    // --- IPC Handlers ---
    ipcRenderer.on('settings-updated', (_e, s) => {
      if (!s) return;
      Object.assign(currentSettings, s);
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--color-1', s.color1 || '#4b7bec');
      rootStyle.setProperty('--color-2', s.color2 || '#74b9ff');
      rootStyle.setProperty('--color-3', s.color3 || '#e07a5f');
    });

    ipcRenderer.on('audio-level', (_e, lvl) => {
      if (!lvl) return;
      const react = Number.isFinite(Number(currentSettings.reactivity))
        ? Math.max(0.1, Math.min(3.0, Number(currentSettings.reactivity)))
        : 1.0;
      const energy = (Number(lvl.level) || 0) * 0.5 + (Number(lvl.bass) || 0) * 0.5;
      audioAuraTarget = lvl.active ? Math.min(1, energy * react) : 0.08;
      scheduleLoop();
    });

    ipcRenderer.on('media-update', (_e, data) => {
      if (!data || !data.title || data.status === 'Closed') {
        clearSeekGrace();
        mediaState.active = false;
        mediaState.status = 'Stopped';
        mediaState.position = 0;
        mediaState.duration = 0;
        mediaState.thumbnailKey = '';
        mediaState.trackSig = '';

        statusDot.className = 'status-dot';
        artCard.classList.add('paused');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        appNameEl.textContent = 'System Media';
        trackTitleEl.textContent = 'No media playing';
        trackArtistEl.textContent = 'Start playback to view lyrics';
        timeElapsedEl.textContent = '0:00';
        timeDurationEl.textContent = '0:00';
        lastProgressRatio = 0;
        lastScrubKnobLeft = '0%';
        scrubFill.style.transform = 'scaleX(0)';
        scrubKnob.style.left = '0%';
        lastElapsedText = '';

        applyArtwork('');

        lyricsState.isSynced = false;
        lyricsState.syncedLyrics = [];
        lyricsState.lineEls = [];
        lyricsState.activeIdx = -99;
        lyricsTrack.textContent = '';
        plainStage.textContent = '';
        setStatusView('Lyrics appear here when playing');
        return;
      }

      const now = Date.now();
      const currentTrackSig = getMediaTrackSig(data);
      if (seekGraceTrackSig && currentTrackSig !== seekGraceTrackSig) {
        clearSeekGrace();
      }
      mediaState.trackSig = currentTrackSig;

      const inSeekGrace = now < seekGraceUntilMs;
      const wasPlaying = mediaState.status === 'Playing';

      let effectiveStatus = data.status || 'Unknown';
      if (inSeekGrace && seekGraceWasPlaying) {
        if (data.status === 'Changing' || data.status === 'Paused') {
          effectiveStatus = 'Playing';
        }
      } else if (data.status === 'Changing' && wasPlaying) {
        effectiveStatus = 'Playing';
      }

      const isPlaying = effectiveStatus === 'Playing';
      const isPaused = effectiveStatus === 'Paused';

      mediaState.active = Boolean(data.active !== false);
      mediaState.status = effectiveStatus;
      mediaState.duration = Number(data.duration) || 0;

      const incomingPos = Number(data.position) || 0;
      if (inSeekGrace) {
        const posDiff = Math.abs(incomingPos - seekTargetSec);
        if (posDiff <= 2.0) {
          clearSeekGrace();
          mediaState.position = incomingPos;
          mediaState.lastUpdatedMs = Number(data.lastUpdatedMs) || now;
        }
      } else {
        mediaState.position = incomingPos;
        mediaState.lastUpdatedMs = Number(data.lastUpdatedMs) || now;
      }

      statusDot.className = 'status-dot' + (isPlaying ? ' playing' : isPaused ? ' paused' : '');
      artCard.classList.toggle('paused', !isPlaying);
      iconPlay.style.display = isPlaying ? 'none' : 'block';
      iconPause.style.display = isPlaying ? 'block' : 'none';

      appNameEl.textContent = resolveSourceName(data);
      trackTitleEl.textContent = data.cleanTitle || data.title || 'Unknown Track';
      trackArtistEl.textContent = data.cleanArtist || data.artist || 'Unknown Artist';

      const artSrc = resolveArtworkSrc(data);
      const thumbKey = computeThumbKey(artSrc);
      if (thumbKey !== mediaState.thumbnailKey) {
        mediaState.thumbnailKey = thumbKey;
        applyArtwork(artSrc);
      }

      timeDurationEl.textContent = mediaState.duration > 0 ? formatTime(mediaState.duration) : (isPlaying ? 'LIVE' : '--:--');
      syncPlayheadAndLyrics(Date.now());
      scheduleLoop();
    });

    ipcRenderer.on('lyrics-update', (_e, lyricsData) => {
      if (!lyricsData || (!lyricsData.loading && !lyricsData.instrumental && !lyricsData.success && !mediaState.active)) {
        lyricsState.isSynced = false;
        lyricsState.syncedLyrics = [];
        lyricsState.lineEls = [];
        lyricsTrack.textContent = '';
        setStatusView('Lyrics appear here when playing');
        return;
      }

      if (lyricsData.loading) {
        lyricsState.isSynced = false;
        lyricsState.syncedLyrics = [];
        lyricsState.lineEls = [];
        lyricsTrack.textContent = '';
        setStatusView('Searching lyrics...');
        return;
      }

      if (lyricsData.instrumental) {
        lyricsState.isSynced = false;
        lyricsState.syncedLyrics = [];
        lyricsState.lineEls = [];
        lyricsTrack.textContent = '';
        setStatusView('Instrumental');
        return;
      }

      if (lyricsData.success && lyricsData.isSynced && Array.isArray(lyricsData.syncedLyrics) && lyricsData.syncedLyrics.length > 0) {
        lyricsState.isSynced = true;
        lyricsState.syncedLyrics = lyricsData.syncedLyrics;
        lyricsCol.setAttribute('data-mode', 'synced');
        buildSyncedLines(lyricsData.syncedLyrics);
        syncPlayheadAndLyrics(Date.now());
        scheduleLoop();
        return;
      }

      if (lyricsData.success && lyricsData.plainLyrics && lyricsData.plainLyrics.trim()) {
        lyricsState.isSynced = false;
        lyricsState.syncedLyrics = [];
        lyricsState.lineEls = [];
        lyricsTrack.textContent = '';
        lyricsCol.setAttribute('data-mode', 'plain');
        plainStage.textContent = lyricsData.plainLyrics.trim();
        plainStage.scrollTop = 0;
        return;
      }

      lyricsState.isSynced = false;
      lyricsState.syncedLyrics = [];
      lyricsState.lineEls = [];
      lyricsTrack.textContent = '';
      setStatusView('No lyrics available');
    });

    function syncPlayheadAndLyrics(nowMs) {
      if (!mediaState.active && mediaState.duration <= 0) return;

      const isCurrentlyPlaying = mediaState.status === 'Playing' || (Date.now() < seekGraceUntilMs && seekGraceWasPlaying);
      let estimatedPos = mediaState.position;
      if (isCurrentlyPlaying) {
        estimatedPos += Math.max(0, (nowMs - mediaState.lastUpdatedMs) / 1000);
      }

      if (!isScrubbing) {
        if (mediaState.duration > 0) {
          estimatedPos = Math.min(mediaState.duration, Math.max(0, estimatedPos));
          applyProgressVisual(estimatedPos / mediaState.duration);
        } else {
          applyProgressVisual(isCurrentlyPlaying ? 1 : 0);
        }

        const elapsedStr = formatTime(estimatedPos);
        if (elapsedStr !== lastElapsedText) {
          lastElapsedText = elapsedStr;
          timeElapsedEl.textContent = elapsedStr;
        }
      }

      if (lyricsState.isSynced && lyricsState.syncedLyrics.length > 0) {
        const lines = lyricsState.syncedLyrics;
        const syncPos = estimatedPos + 0.15;
        let activeIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].time <= syncPos) {
            activeIdx = i;
          } else {
            break;
          }
        }
        if (activeIdx !== lyricsState.activeIdx) {
          lyricsState.activeIdx = activeIdx;
          updateSyncedLayout(activeIdx);
        }
      }
    }

    // --- Lightweight Refresh-Rate-Adaptive Loop ---
    let lastFrameMs = null;
    function scheduleLoop() {
      if (rafId !== null) return;
      lastFrameMs = null;
      rafId = requestAnimationFrame(loop);
    }

    function loop(nowMs) {
      rafId = null;
      const dt = lastFrameMs === null
        ? (1 / targetHz)
        : Math.min(0.05, Math.max(0.001, (nowMs - lastFrameMs) / 1000));
      lastFrameMs = nowMs;

      audioAuraSmooth += (audioAuraTarget - audioAuraSmooth) * (1 - Math.exp(-dt * 12));
      const auraOpStr = (0.08 + audioAuraSmooth * 0.45).toFixed(3);
      if (auraOpStr !== lastAuraOpacity) {
        lastAuraOpacity = auraOpStr;
        backdropAura.style.opacity = auraOpStr;
      }

      syncPlayheadAndLyrics(Date.now());

      const isCurrentlyPlaying =
        mediaState.status === 'Playing' ||
        (Date.now() < seekGraceUntilMs && seekGraceWasPlaying);

      const needsMore =
        (mediaState.active && isCurrentlyPlaying) ||
        Math.abs(audioAuraTarget - audioAuraSmooth) > 0.005;

      if (needsMore) {
        rafId = requestAnimationFrame(loop);
      } else {
        lastFrameMs = null;
      }
    }

    ipcRenderer.on('display-config', (_e, cfg) => {
      if (!cfg) return;
      const hz = Number(cfg.displayFrequency);
      if (Number.isFinite(hz) && hz >= 30 && hz <= 360) {
        targetHz = Math.round(hz);
        scheduleLoop();
      }
    });

    window.addEventListener('resize', () => {
      if (lyricsState.isSynced && lyricsState.lineEls.length > 0) {
        updateSyncedLayout(lyricsState.activeIdx);
      }
    });

    ipcRenderer.send('fullscreen-ready');
  </script>
</body>
</html>
